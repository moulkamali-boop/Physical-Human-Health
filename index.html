<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#0A1226">
<title>🧬 Physics Lab Human Health</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%A7%AC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
:root{
  --bg:#0A1226;--bg2:#0E1A33;--card:#101D3A;
  --line:#1E2D4F;--line2:#2A3A5E;
  --gold:#F5C24A;--gold2:#E0A92E;--goldGlow:#F5C24A33;
  --blue:#4A90E2;--blue2:#5B9CF0;--cyan:#00BCD4;
  --borderBlue:#00A8FF;--borderBlueGlow:#00A8FF55;
  --ink:#E1E7EF;--ink2:#A4B3C7;--ink3:#6B7B92;
  --ok:#2ECC71;--warn:#F39C12;--alert:#E74C3C;
  --r:20px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{background:#050810;color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;display:flex;justify-content:center;align-items:center;padding:14px 10px;min-height:100vh;line-height:1.5}
.app{max-width:600px;width:100%;max-height:calc(100vh - 28px);background:linear-gradient(180deg,#0A1226,#0B1A2E);border:3px solid var(--borderBlue);border-radius:24px;padding:14px;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;box-shadow:0 0 0 1px #00A8FF33,0 0 30px var(--borderBlueGlow),0 20px 60px #00000088;position:relative}
.app::-webkit-scrollbar{width:5px}
.app::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}

/* HEADER */
.hdr{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;padding-bottom:8px;flex-shrink:0}
.hdr-btn{width:44px;height:44px;background:linear-gradient(135deg,#1E2D4F,#2A3A5E);border:1px solid #3B4A6E;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer;transition:.2s;color:var(--gold);flex-shrink:0}
.hdr-btn:hover{border-color:var(--gold);box-shadow:0 0 12px var(--goldGlow)}
.hdr-btn.left{justify-self:start}.hdr-btn.right{justify-self:end}
.hdr-center{text-align:center;overflow:hidden}
.hdr-title-en{font-size:1rem;font-weight:800;color:var(--gold);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
.hdr-sub{font-size:.76rem;color:#fff;font-weight:700;margin-top:3px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-divider{height:2px;background:linear-gradient(90deg,transparent 5%,var(--gold) 30%,var(--gold) 70%,transparent 95%);margin:4px 0 10px;border-radius:2px;flex-shrink:0}

/* DATETIME + LOC */
.dt-row{display:flex;justify-content:space-between;align-items:center;background:#0E1A33;border:1.5px solid var(--line);border-radius:30px;padding:8px 14px;margin-bottom:8px;font-size:.78rem;font-weight:700;color:var(--ink);flex-shrink:0}
.dt-row span{display:flex;align-items:center;gap:6px;font-family:ui-monospace,monospace;color:#fff}
.dt-row .ic{font-size:1rem}
.loc-row{display:flex;justify-content:center;align-items:center;background:#0E1A33;border:1.5px solid var(--line);border-radius:30px;padding:8px 14px;margin-bottom:8px;font-size:.76rem;color:var(--ink2);font-weight:700;min-height:36px;flex-shrink:0}
.loc-row span{color:#fff;font-family:ui-monospace,monospace;display:flex;align-items:center;gap:6px}

/* ID + LANG */
.id-lang-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;flex-shrink:0}
.id-badge{display:flex;align-items:center;justify-content:space-between;background:#0E1A33;border:1.5px solid var(--line);border-radius:30px;padding:8px 14px;font-family:ui-monospace,monospace;font-size:.72rem;font-weight:700;color:#fff;cursor:pointer;transition:.2s}
.id-badge:hover{border-color:var(--gold)}
.id-badge .id-ic{background:linear-gradient(135deg,#8B5CF6,#7C3AED);color:#fff;font-size:.6rem;padding:2px 6px;border-radius:5px;letter-spacing:.5px;font-weight:900;margin-left:6px}
.id-badge .id-txt{flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
.id-badge .id-arrow{color:var(--ink3);font-size:.7rem;margin-right:4px}
.lang-badge{display:flex;align-items:center;gap:8px;background:#0E1A33;border:1.5px solid var(--line);border-radius:30px;padding:8px 14px;cursor:pointer}
.lang-badge select{background:transparent;border:none;color:#fff;font-size:.76rem;font-weight:700;font-family:inherit;cursor:pointer;flex:1;outline:none;text-align:right}
.lang-badge .lg-arrow{color:var(--ink3);font-size:.7rem}

/* MAIN CARD */
.main-card{background:linear-gradient(180deg,#0E1A33,#0B1429);border:2px solid var(--gold);border-radius:var(--r);padding:16px 14px;margin-bottom:6px;box-shadow:0 8px 30px #00000055,inset 0 0 40px #F5C24A08}
.credit-line{display:flex;justify-content:center;align-items:center;gap:10px;font-size:.92rem;font-weight:800;color:#fff;margin-bottom:10px}
.credit-line .cr-num{font-size:1.8rem;font-weight:900;color:var(--gold);font-family:ui-monospace,monospace;line-height:1;text-shadow:0 0 20px var(--goldGlow)}
.credit-line .cr-num.inf{font-size:1.6rem}
.divider-inner{height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent);margin:12px 0 14px}
.pack-lbl{text-align:center;font-size:.82rem;font-weight:800;color:#fff;margin-bottom:10px;letter-spacing:.3px}
.pkg-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.pkg-btn{background:linear-gradient(180deg,#0B1429,#0E1A33);border:2px solid var(--gold);border-radius:16px;padding:12px 6px 10px;cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
.pkg-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px var(--goldGlow);background:linear-gradient(180deg,#131F3D,#0E1A33)}
.pkg-btn .p-num{font-size:1.55rem;font-weight:900;color:var(--gold);font-family:ui-monospace,monospace;line-height:1}
.pkg-btn .p-price{font-size:.78rem;font-weight:800;color:#fff}
.code-lbl{text-align:center;font-size:.82rem;font-weight:800;color:#fff;margin-bottom:10px;letter-spacing:.3px}
.code-row{display:flex;gap:8px}
.code-row input{flex:1;padding:11px 16px;background:#0B1429;border:1.5px solid var(--line);border-radius:30px;color:#fff;font-size:.78rem;font-family:inherit;min-width:0}
.code-row input:focus{border-color:var(--gold);outline:none}
.code-row input::placeholder{color:var(--ink3)}
.code-row button{background:linear-gradient(135deg,var(--blue),var(--blue2));border:none;border-radius:30px;padding:11px 22px;color:#fff;font-weight:800;cursor:pointer;font-size:.8rem;font-family:inherit;transition:.2s;box-shadow:0 4px 14px #4A90E244;flex-shrink:0}
.code-row button:hover{transform:translateY(-1px)}

/* START BTN */
.start-btn{margin-top:0;width:100%;padding:16px;background:linear-gradient(135deg,#F5C24A,#E0A92E);border:none;border-radius:32px;font-weight:900;color:#0A1226;font-size:.95rem;cursor:pointer;font-family:inherit;transition:.2s;letter-spacing:.3px;box-shadow:0 8px 26px var(--goldGlow);display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0}
.start-btn:hover{transform:translateY(-1px)}
.report-btn{margin-top:8px;width:100%;padding:14px;background:linear-gradient(135deg,#00A8FF,#0066CC);border:none;border-radius:32px;font-weight:900;color:#fff;font-size:.9rem;cursor:pointer;font-family:inherit;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0;box-shadow:0 8px 26px #00A8FF44}
.report-btn:hover{transform:translateY(-1px);box-shadow:0 12px 32px #00A8FF66}

/* BACK BAR */
.back-bar{display:none;padding:8px 0;margin-bottom:8px;flex-shrink:0}
.back-bar.show{display:block}
.back-bar .bb-btn{background:#0E1A33;border:1.5px solid var(--line);border-radius:30px;padding:9px 18px;color:var(--ink);font-size:.78rem;font-weight:800;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:8px;transition:.2s}
.back-bar .bb-btn:hover{border-color:var(--gold);color:var(--gold)}

/* SIGNALS */
.hidden{display:none!important}
.section-title{font-size:.85rem;color:var(--gold);font-weight:800;margin-bottom:10px;letter-spacing:.3px;text-align:center}
.sig-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.sig-card{background:linear-gradient(180deg,#0E1A33,#0B1429);border:2px solid var(--line);border-radius:16px;padding:14px 10px;cursor:pointer;transition:.2s;text-align:center;position:relative;overflow:hidden}
.sig-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--sig,var(--gold))}
.sig-card:hover{transform:translateY(-2px);border-color:var(--sig,var(--gold));box-shadow:0 8px 22px #00000088}
.sig-card .sc-count{position:absolute;top:8px;left:8px;background:#0A1226;color:var(--sig);font-size:.6rem;font-weight:900;padding:2px 8px;border-radius:20px;border:1px solid var(--sig)}
.sig-card .sc-icon{font-size:1.9rem;display:block;margin:2px 0 8px}
.sig-card .sc-name{font-size:.82rem;font-weight:800;color:#fff;margin-bottom:3px}
.sig-card .sc-desc{font-size:.62rem;color:var(--ink3);line-height:1.35}

.meas-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.meas-card{background:linear-gradient(180deg,#0E1A33,#0B1429);border:2px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:11px;position:relative}
.meas-card::before{content:'';position:absolute;top:0;right:22px;left:22px;height:2px;background:var(--sig,var(--gold));border-radius:0 0 2px 2px;opacity:.6}
.meas-card:hover{border-color:var(--sig,var(--gold));transform:translateX(-2px)}
.meas-card.done{border-color:#2ECC7155;background:linear-gradient(180deg,#0E2A22,#0B1F18)}
.meas-card.done::before{background:#2ECC71}
.meas-card .mc-icon{font-size:1.3rem;width:44px;height:44px;background:#0A1226;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1.5px solid var(--line)}
.meas-card .mc-body{flex:1;min-width:0}
.meas-card .mc-name{font-size:.85rem;font-weight:800;color:#fff;margin-bottom:2px}
.meas-card .mc-abbr{font-family:ui-monospace,monospace;font-size:.66rem;color:var(--sig,var(--gold));font-weight:900;letter-spacing:.5px}
.meas-card .mc-status{font-size:.85rem;flex-shrink:0;font-weight:700}
.info-btn{width:26px;height:26px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:none;border-radius:50%;font-size:.72rem;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;font-family:inherit;transition:.2s}
.info-btn:hover{transform:scale(1.15)}

/* MODALS */
.modal-bg{position:fixed;inset:0;background:rgba(5,10,20,.95);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px;overflow-y:auto}
.modal-bg.show{display:flex}
.modal{background:linear-gradient(180deg,#0E1A33,#0A1226);border:2px solid var(--gold);border-radius:22px;max-width:520px;width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px #000}
.modal.wide{max-width:640px}
.modal-hd{padding:14px 16px;border-bottom:1.5px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#101D3A,#0E1A33);flex-shrink:0}
.modal-hd h3{font-size:.9rem;color:var(--gold);font-weight:800;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.modal-hd .abbr{font-family:ui-monospace,monospace;color:var(--ink3);font-size:.7rem;font-weight:700}
.modal-hd .close{background:transparent;border:none;color:var(--ink2);font-size:1.05rem;cursor:pointer;padding:4px 8px;border-radius:8px;font-family:inherit;flex-shrink:0}
.modal-hd .close:hover{color:var(--alert)}
.modal-bd{padding:16px;overflow-y:auto;flex:1}
.modal-ft{padding:12px 16px;border-top:1.5px solid var(--line);display:flex;gap:8px;background:#0E1A33;flex-shrink:0;flex-wrap:wrap}

.btn{padding:10px 16px;border:none;border-radius:14px;font-family:inherit;font-weight:800;font-size:.8rem;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;flex:1;min-width:0}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0A1226;box-shadow:0 4px 14px var(--goldGlow)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-ghost{background:#0A1226;border:1.5px solid var(--line);color:var(--ink2)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-blue{background:linear-gradient(135deg,#00A8FF,#0066CC);color:#fff}
.btn-blue:hover{transform:translateY(-1px)}
.btn-danger{background:linear-gradient(135deg,var(--alert),#C0392B);color:#fff}
.btn-ok{background:linear-gradient(135deg,#2ECC71,#27AE60);color:#fff}

/* ADMIN */
.admin-actions{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.admin-action-btn{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#0A1226,#0E1A33);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--ink);font-family:inherit;cursor:pointer;transition:.2s;text-align:right;width:100%}
.admin-action-btn:hover{border-color:var(--gold);background:#0E1A33;transform:translateX(-2px)}
.admin-action-btn.danger{border-color:#E74C3C33;color:#E86B58}
.admin-action-btn.danger:hover{border-color:var(--alert)}
.admin-action-btn .aa-icon{font-size:1.15rem;flex-shrink:0;width:24px;text-align:center}
.admin-action-btn .aa-txt{flex:1;font-weight:700;font-size:.82rem;line-height:1.3}
.admin-action-btn .aa-txt small{display:block;font-size:.62rem;color:var(--ink3);font-weight:500;margin-top:2px}

/* FIELDS */
.field{margin-bottom:12px}
.field label{display:block;font-size:.72rem;color:var(--ink2);font-weight:700;margin-bottom:6px}
.field label .req{color:var(--alert);font-weight:900;margin-right:3px}
.field label .opt{color:var(--ink3);font-weight:500;font-size:.62rem}
.field input,.field select{width:100%;padding:11px 14px;background:#0A1226;border:1.5px solid var(--line);border-radius:12px;color:#fff;font-size:.85rem;font-family:inherit}
.field input:focus,.field select:focus{border-color:var(--gold);outline:none}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* MEASUREMENT */
.meas-intro{text-align:center;padding:10px 0 4px}
.meas-intro .mi-icon{font-size:2.6rem;margin-bottom:8px;display:block}
.meas-intro .mi-name{font-size:1rem;font-weight:900;color:var(--gold);margin-bottom:4px}
.meas-intro .mi-abbr{font-family:ui-monospace,monospace;font-size:.7rem;color:var(--ink3);letter-spacing:.5px;font-weight:700}
.tip-bar{margin-top:14px;padding:12px 14px;background:linear-gradient(180deg,#0A1226,#0E1A33);border-radius:12px;border-right:3px solid var(--blue);display:flex;gap:10px;align-items:flex-start;text-align:right}
.tip-bar .tb-icon{font-size:1.05rem;flex-shrink:0;line-height:1.4}
.tip-bar .tb-tx{flex:1;font-size:.78rem;color:var(--ink);line-height:1.7}
.prog-ring{position:relative;width:130px;height:130px;margin:14px auto}
.prog-ring svg{transform:rotate(-90deg);display:block}
.prog-ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,monospace;font-size:1.55rem;font-weight:900;color:var(--gold)}
.prog-live{font-size:.72rem;color:var(--blue);text-align:center;font-family:ui-monospace,monospace;margin-top:10px;min-height:20px;font-weight:700}
.result-box{text-align:center;padding:20px 14px;background:linear-gradient(180deg,#0A1226,#0E1A33);border-radius:16px;border:1.5px solid var(--line);margin-bottom:12px;position:relative;overflow:hidden}
.result-box::before{content:'';position:absolute;top:0;left:30%;right:30%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.result-val{font-size:2.4rem;font-weight:900;color:var(--gold);font-family:ui-monospace,monospace;line-height:1;letter-spacing:-1px;text-shadow:0 0 20px var(--goldGlow)}
.result-unit{font-size:.78rem;color:var(--ink2);margin-top:6px;font-weight:700}
.result-freq{font-size:.7rem;color:var(--blue);margin-top:4px;font-family:ui-monospace,monospace;font-weight:700}
.result-lbl{font-size:.7rem;color:var(--ink3);margin-top:8px;font-weight:700}
.q-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:20px;font-size:.68rem;font-weight:800;margin-top:10px}
.q-good{background:#2ECC7122;color:#4CD090;border:1.5px solid #2ECC71}
.q-mid{background:#F39C1222;color:#F5B845;border:1.5px solid #F39C12}
.q-bad{background:#E74C3C22;color:#E86B58;border:1.5px solid #E74C3C}
.meta-line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.7rem}
.meta-line:last-child{border-bottom:none}
.meta-line .ml-key{color:var(--ink3);font-weight:600}
.meta-line .ml-val{color:var(--blue);font-family:ui-monospace,monospace;font-weight:800}
.simplify-bar{margin-top:12px;padding:11px 13px;background:linear-gradient(180deg,#0A1226,#0E1A33);border-radius:12px;border-right:3px solid var(--gold);display:flex;gap:10px;align-items:flex-start}
.simplify-bar .sb-icon{font-size:1.05rem;flex-shrink:0;line-height:1.4}
.simplify-bar .sb-tx{flex:1;font-size:.76rem;color:var(--ink);line-height:1.7}
.simplify-bar .sb-tx strong{color:var(--gold);font-weight:800}

/* INFO */
.info-sec{margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.info-sec:last-child{border-bottom:none;padding-bottom:0;margin-bottom:0}
.info-sec h4{font-size:.8rem;color:var(--gold);margin-bottom:7px;font-weight:800;display:flex;align-items:center;gap:6px}
.info-sec p,.info-sec li{font-size:.78rem;color:var(--ink);line-height:1.85;margin:4px 0}
.dev-tag{display:inline-block;background:#4A90E222;color:#7DB8E0;padding:2px 7px;border-radius:6px;font-size:.55rem;font-weight:900;border:1px solid #4A90E244;font-family:ui-monospace,monospace}
.formula-box{background:#050E1A;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:ui-monospace,monospace;font-size:.75rem;color:#7DEEEB;margin:7px 0;direction:ltr;text-align:left;overflow-x:auto;line-height:1.75}
.source-box{background:#050E1A;border-right:3px solid #8B5CF6;border-radius:10px;padding:10px 12px;font-size:.68rem;color:var(--ink2);line-height:1.65;font-style:italic;margin-top:7px}
.limit-box{background:#7C2D1233;border-right:3px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:.72rem;color:#FCD34D;line-height:1.6;margin-top:5px}

/* REPORT */
.report-box{background:#080F20;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-family:ui-monospace,monospace;font-size:.72rem;line-height:1.6;color:#C5D0DE;overflow-x:auto}
.report-hd{text-align:center;color:var(--gold);font-weight:900;font-size:.88rem;padding-bottom:8px;border-bottom:1.5px double var(--gold);margin-bottom:10px;letter-spacing:.3px}
.report-meta{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:3px 10px;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:10px;font-size:.68rem}
.report-meta .k{color:var(--ink3);font-weight:700}
.report-meta .v{color:#fff;font-weight:700}
.report-status{padding:6px 10px;border-radius:8px;font-size:.7rem;font-weight:900;text-align:center;margin-bottom:10px}
.report-status.complete{background:#2ECC7122;color:#4CD090;border:1px solid #2ECC7155}
.report-status.partial{background:#F39C1222;color:#F5B845;border:1px solid #F39C1255}
.report-sig{margin-bottom:12px;border-bottom:1px dashed var(--line);padding-bottom:10px}
.report-sig:last-of-type{border-bottom:none}
.report-sig-hd{font-size:.78rem;color:var(--gold);font-weight:900;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.report-sig-hd .cnt{font-size:.68rem;color:var(--ink3);font-family:ui-monospace,monospace}
.report-tbl{width:100%;border-collapse:collapse;font-size:.68rem}
.report-tbl th{color:var(--ink3);font-weight:800;padding:4px 6px;text-align:right;border-bottom:1px solid var(--line);font-size:.62rem;letter-spacing:.3px}
.report-tbl td{padding:5px 6px;border-bottom:1px dashed #1E2D4F55;font-family:ui-monospace,monospace;font-size:.68rem}
.report-tbl tr:last-child td{border-bottom:none}
.report-tbl .t-cell-ic{font-size:.85rem;text-align:center;width:24px}
.report-tbl .t-cell-cap{text-align:center;font-size:.85rem;width:26px}
.report-tbl .t-cell-res{color:#fff;font-weight:700;text-align:right;white-space:nowrap}
.report-tbl .t-cell-rng{color:var(--ink3);text-align:right;font-size:.62rem}
.report-tbl tr.empty td{opacity:.55}
.report-tbl tr.empty .t-cell-res{color:#5A6479}
.report-summary{background:#0A1226;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.72rem;text-align:center;margin-top:10px;color:#fff;font-weight:800}
.report-footer{border-top:1.5px double var(--gold);padding-top:8px;margin-top:12px;text-align:center;font-size:.62rem;color:var(--ink3);line-height:1.7}
.report-note{background:#F39C1215;border:1px solid #F39C1244;border-radius:8px;padding:8px 10px;font-size:.68rem;color:#F5B845;margin-top:10px;line-height:1.7;text-align:right}

/* TOAST + BADGE */
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#0E1A33;border:2px solid var(--gold);color:#fff;padding:10px 18px;border-radius:14px;font-size:.75rem;font-weight:700;z-index:9999;display:none;box-shadow:0 8px 24px #00000088;max-width:90%;text-align:center}
.toast.show{display:block}
.admin-badge{position:fixed;bottom:10px;left:10px;background:linear-gradient(135deg,#4A90E2,#2B6CB0);color:#fff;border:1px solid #5B9CF0;padding:4px 10px;border-radius:20px;font-size:.6rem;font-weight:900;z-index:900;display:none;font-family:ui-monospace,monospace;opacity:.85}
.admin-badge.show{display:block}
.qr-modal-box{background:#fff;border-radius:20px;padding:20px;text-align:center;max-width:320px;width:100%}
.qr-modal-box h3{color:#0A1226;font-size:1rem;margin-bottom:12px;font-weight:800}
.qr-modal-box img{max-width:100%;height:auto;border-radius:10px;display:block;margin:0 auto}
.qr-modal-box .qr-url{font-family:ui-monospace,monospace;font-size:.65rem;color:#666;margin-top:12px;word-break:break-all}
.qr-modal-box .qr-close{margin-top:14px;background:#0A1226;color:#fff;border:none;border-radius:20px;padding:10px 24px;font-weight:700;cursor:pointer;font-family:inherit}

@media(max-width:380px){.sig-grid{grid-template-columns:1fr}.field-row{grid-template-columns:1fr}}

function fft(re,im){const n=re.length;if(n<=1)return;const eR=new Float32Array(n/2),eI=new Float32Array(n/2),oR=new Float32Array(n/2),oI=new Float32Array(n/2);for(let i=0;i<n/2;i++){eR[i]=re[2*i];eI[i]=im[2*i];oR[i]=re[2*i+1];oI[i]=im[2*i+1]}fft(eR,eI);fft(oR,oI);for(let k=0;k<n/2;k++){const a=-2*Math.PI*k/n;const tR=Math.cos(a)*oR[k]-Math.sin(a)*oI[k];const tI=Math.sin(a)*oR[k]+Math.cos(a)*oI[k];re[k]=eR[k]+tR;im[k]=eI[k]+tI;re[k+n/2]=eR[k]-tR;im[k+n/2]=eI[k]-tI}}
function fftMag(sig){let N=1;while(N<sig.length)N*=2;const re=new Float32Array(N),im=new Float32Array(N);const m=mean(sig);for(let i=0;i<sig.length;i++)re[i]=sig[i]-m;fft(re,im);const mag=new Float32Array(N/2);for(let k=0;k<N/2;k++)mag[k]=Math.sqrt(re[k]*re[k]+im[k]*im[k]);return {mag,size:N}}

async function cam(dur,flash,rate){const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:160,height:120}});const v=document.createElement('video');v.srcObject=s;v.setAttribute('playsinline','true');v.muted=true;await new Promise(r=>v.onloadedmetadata=r);await v.play();if(flash){try{const tr=s.getVideoTracks()[0];const c=tr.getCapabilities&&tr.getCapabilities();if(c&&c.torch)await tr.applyConstraints({advanced:[{torch:true}]})}catch(e){}}const cn=document.createElement('canvas');cn.width=160;cn.height=120;const ctx=cn.getContext('2d',{willReadFrequently:true});const fr=[];const t0=performance.now();const iv=rate||33;while(performance.now()-t0<dur&&MEASURING){ctx.drawImage(v,0,0,160,120);const d=ctx.getImageData(0,0,160,120).data;let r=0,g=0,b=0,c=0;for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];c++}fr.push({t:performance.now()-t0,r:r/c,g:g/c,b:b/c});await new Promise(r=>setTimeout(r,iv))}s.getTracks().forEach(x=>x.stop());return fr}
async function aud(dur){const s=await navigator.mediaDevices.getUserMedia({audio:true});const AC=window.AudioContext||window.webkitAudioContext;const ctx=new AC();const an=ctx.createAnalyser();an.fftSize=2048;const src=ctx.createMediaStreamSource(s);src.connect(an);const fb=new Uint8Array(an.frequencyBinCount);const tb=new Uint8Array(an.fftSize);const ff=[],tf=[];const sr=ctx.sampleRate;const t0=performance.now();while(performance.now()-t0<dur&&MEASURING){an.getByteFrequencyData(fb);an.getByteTimeDomainData(tb);ff.push(new Uint8Array(fb));tf.push(new Uint8Array(tb));await new Promise(r=>setTimeout(r,50))}s.getTracks().forEach(x=>x.stop());ctx.close();return {ff,tf,sr,fftSize:2048}}
async function mot(dur){const a=[],g=[];const h=e=>{const x=e.accelerationIncludingGravity;if(x)a.push({x:x.x,y:x.y,z:x.z,mag:Math.sqrt(x.x*x.x+x.y*x.y+x.z*x.z),t:performance.now()});const r=e.rotationRate;if(r)g.push({x:r.alpha,y:r.beta,z:r.gamma,t:performance.now()})};window.addEventListener('devicemotion',h);const t0=performance.now();await new Promise(r=>setTimeout(r,dur));window.removeEventListener('devicemotion',h);return {accel:a,gyro:g,duration:performance.now()-t0}}

function openMeasure(mId){if(!hasPersonal()){toast('⚠️ '+t('ageRequired'));openPersonalModal();return}CURRENT_MEASURE=mId;const m=MEASURES[mId];const data=tx(m)||{};$('mmIcon').textContent=m.icon;$('mmTitle').textContent=data.n||mId;$('mmAbbr').textContent=m.abbr;renderIntro();show('measureModal')}
function renderIntro(){const mId=CURRENT_MEASURE;const m=MEASURES[mId];const data=tx(m)||{};$('mmBody').innerHTML=`<div class="meas-intro"><span class="mi-icon">${m.icon}</span><div class="mi-name">${data.n||mId}</div><div class="mi-abbr">${m.abbr} · ${m.dur} ${t('seconds')}</div></div><div class="tip-bar"><span class="tb-icon">💡</span><div class="tb-tx">${data.u||''}</div></div>`;$('mmFooter').innerHTML=`<button class="btn btn-ghost" onclick="closeMeasureModal()">✖ ${t('cancel')}</button><button class="btn btn-primary" onclick="startMeasure()">▶️ ${t('measure')}</button>`}
async function startMeasure(){if(!CURRENT_MEASURE||MEASURING)return;MEASURING=true;const mId=CURRENT_MEASURE;const m=MEASURES[mId];const sig=CURRENT_SIGNAL;const total=m.dur*1000;const t0=performance.now();$('mmBody').innerHTML=`<div style="text-align:center;padding-top:10px"><div class="prog-ring"><svg width="130" height="130"><circle cx="65" cy="65" r="56" fill="none" stroke="#1E2D4F" stroke-width="8"/><circle id="progCircle" cx="65" cy="65" r="56" fill="none" stroke="${sig.color}" stroke-width="8" stroke-dasharray="351.8" stroke-dashoffset="351.8" stroke-linecap="round"/></svg><div class="pct" id="progPct">0%</div></div><div style="font-size:.85rem;color:var(--ink2);font-weight:700">${t('measuring')}</div><div class="prog-live" id="progLive">${t('pleaseWait')}...</div></div>`;$('mmFooter').innerHTML=`<button class="btn btn-danger" onclick="cancelMeasure()">⏹ ${t('cancel')}</button>`;const upd=setInterval(()=>{const el=performance.now()-t0;const p=Math.min(1,el/total);const c=$('progCircle');if(c)c.setAttribute('stroke-dashoffset',(351.8*(1-p)).toFixed(1));const pe=$('progPct');if(pe)pe.textContent=Math.round(p*100)+'%';const lv=$('progLive');if(lv)lv.textContent=`${t('live')} · ${(el/1000).toFixed(1)} ${t('seconds')}`},100);try{const fn=M_FNS[mId];if(!fn)throw new Error('no fn');const result=await fn();clearInterval(upd);MEASURING=false;SESSION.results[mId]=result;renderResult(mId,result)}catch(e){clearInterval(upd);MEASURING=false;console.warn(e);renderError(e.message)}}
function cancelMeasure(){MEASURING=false;renderIntro()}
function renderResult(mId,result){const m=MEASURES[mId];const data=tx(m)||{};const q=result.quality||'mid';const qc=q==='good'?'q-good':q==='mid'?'q-mid':'q-bad';const ql=q==='good'?t('good'):q==='mid'?t('mid'):t('bad');const range=data.r||'—';$('mmBody').innerHTML=`<div class="result-box"><div class="result-val">${result.value}</div><div class="result-unit">${result.unit}</div><div class="result-lbl">${data.n||mId}</div><div class="q-badge ${qc}">● ${t('quality')}: ${ql}</div></div><div class="meta-line"><span class="ml-key">${t('normalRange')}</span><span class="ml-val">${range}</span></div><div class="simplify-bar"><span class="sb-icon">🧭</span><div class="sb-tx"><strong>${t('simplify')}:</strong> ${data.s||''}</div></div>`;$('mmFooter').innerHTML=`<button class="btn btn-ghost" onclick="renderIntro()">🔄 ${t('retry')}</button><button class="btn btn-primary" onclick="closeMeasureModal()">✔ ${t('done')}</button>`;saveSession();updateReportBtn()}
function renderError(msg){$('mmBody').innerHTML=`<div style="text-align:center;padding:20px"><div style="font-size:2.5rem;margin-bottom:10px">⚠️</div><div style="color:var(--alert);font-weight:800;margin-bottom:8px">${t('sensorErr')}</div><div style="font-size:.72rem;color:var(--ink3);font-family:ui-monospace,monospace">${msg||''}</div></div>`;$('mmFooter').innerHTML=`<button class="btn btn-ghost" onclick="renderIntro()">🔄 ${t('retry')}</button><button class="btn btn-primary" onclick="closeMeasureModal()">${t('close')}</button>`}
function closeMeasureModal(){MEASURING=false;hide('measureModal')}

function saveSession(){
  try{
    const s={id:SESSION.id,started:SESSION.started,results:SESSION.results,user:{name:localStorage.getItem('plh_name')||'',age:parseInt(localStorage.getItem('plh_age'))||0,gender:localStorage.getItem('plh_gender')||''}};
    localStorage.setItem('plh_session_'+SESSION.id,JSON.stringify(s));

function renderReport(){
  const user={
    name:localStorage.getItem('plh_name')||'—',
    age:localStorage.getItem('plh_age')||'—',
    gender:localStorage.getItem('plh_gender')||'—',
    id:$('deviceId').textContent
  };
  const gLabel=user.gender==='male'?t('optMale'):user.gender==='female'?t('optFemale'):user.gender;
  const count=Object.keys(SESSION.results).length;
  const complete=count===24;
  const dt=new Date(SESSION.started||Date.now());
  let html='';
  html+='<div class="report-box">';
  html+='<div class="report-hd">🧬 Physics Lab Human Health<br>'+t('reportTitle')+'</div>';
  html+='<div class="report-meta">';
  html+='<span class="k">'+t('reportUser')+':</span><span class="v">'+user.name+'</span>';
  html+='<span class="k">'+t('reportAge')+':</span><span class="v">'+user.age+'</span>';
  html+='<span class="k">'+t('reportGender')+':</span><span class="v">'+gLabel+'</span>';
  html+='<span class="k">'+t('reportId')+':</span><span class="v">'+user.id+'</span>';
  html+='<span class="k">'+t('reportSession')+':</span><span class="v">'+SESSION.id+'</span>';
  html+='<span class="k">'+t('reportDate')+':</span><span class="v">'+dt.toLocaleDateString('en-GB')+'</span>';
  html+='<span class="k">'+t('reportTime')+':</span><span class="v">'+dt.toLocaleTimeString('en-GB')+'</span>';
  html+='</div>';
  html+=`<div class="report-status ${complete?'complete':'partial'}">${complete?t('reportComplete'):t('reportPartial')} — ${count}/24</div>`;
  SIGNALS.forEach(sig=>{
    const taken=sig.measures.filter(m=>SESSION.results[m]).length;
    html+=`<div class="report-sig"><div class="report-sig-hd"><span>${sig.icon} ${tx(sig.name)}</span><span class="cnt">[${taken}/${sig.measures.length}]</span></div>`;
    html+='<table class="report-tbl"><thead><tr><th style="width:24px"></th><th style="width:26px"></th><th>'+t('reportSignal')+'</th><th>'+t('reportCapture')+'</th><th>'+t('reportResult')+'</th><th>'+t('reportRange')+'</th></tr></thead><tbody>';
    sig.measures.forEach(mId=>{
      const m=MEASURES[mId];
      const data=tx(m)||{};
      const res=SESSION.results[mId];
      const sensor=MEASURE_SENSOR[mId]||'';
      const isDone=!!res;
      const qSymbol=isDone?(res.quality==='good'?'🟢':res.quality==='mid'?'🟡':res.quality==='bad'?'🔴':'⚪'):'⚪';
      const resultStr=isDone?`${res.value} ${res.unit}`:'—';
      const rangeStr=data.r||'—';
      const trCls=isDone?'':'empty';
      html+=`<tr class="${trCls}">
        <td class="t-cell-ic">${sensor}</td>
        <td class="t-cell-cap">${qSymbol}</td>
        <td>${m.abbr} · ${data.n||mId}</td>
        <td>${m.dur}${t('seconds')}</td>
        <td class="t-cell-res">${resultStr}</td>
        <td class="t-cell-rng">${rangeStr}</td>
      </tr>`;
    });
    html+='</tbody></table></div>';
  });
  if(!complete){
    html+='<div class="report-note">'+t('reportPartialNote')+'</div>';
  }
  const hash=SESSION.id.slice(-6);
  html+=`<div class="report-summary">📊 ${t('reportTotal')}: ${count}/24 · 🟢 ${Object.values(SESSION.results).filter(r=>r.quality==='good').length} · 🟡 ${Object.values(SESSION.results).filter(r=>r.quality==='mid').length} · 🔴 ${Object.values(SESSION.results).filter(r=>r.quality==='bad').length}</div>`;
  html+=`<div class="report-footer">🔐 ${t('reportVerification')}: ${hash}<br>📅 ${t('reportIssued')}: ${new Date().toLocaleString('en-GB')}</div>`;
  html+='</div>';
  $('rmTitle').textContent=t('reportTitle');
  $('rmBody').innerHTML=html;
  $('rmFooter').innerHTML=`
    <button class="btn btn-ghost" onclick="copyReport()">${t('reportCopy')}</button>
    <button class="btn btn-ghost" onclick="listenReport()">${t('reportListen')}</button>
    <button class="btn btn-blue" onclick="printReport()">${t('reportPrint')}</button>
    <button class="btn btn-primary" onclick="closeReport()">${t('reportClose')}</button>
  `;
  show('reportModal');
  saveHistory();
}

    $('rmBody').innerHTML+
    '</body></html>');

function saveHistory(){
  try{
    const h=JSON.parse(localStorage.getItem('plh_history')||'[]');
    const existing=h.findIndex(x=>x.id===SESSION.id);
    const entry={id:SESSION.id,date:SESSION.started,count:Object.keys(SESSION.results).length,complete:Object.keys(SESSION.results).length===24};
    if(existing>=0)h[existing]=entry;else h.unshift(entry);
    if(h.length>30)h=h.slice(0,30);
    localStorage.setItem('plh_history',JSON.stringify(h));
  }catch(e){}
}

function applyLang(){
  const m={appSub:'appSub',startLbl:'startLbl',reportLbl:'reportLbl',backLbl:'backLbl',signalsTitle:'signalsTitle',creditLbl:'creditLbl',packLbl:'packLbl',codeLbl:'codeLbl',activateBtn:'activateBtn',pmTitle:'pmTitle',pmNameLbl:'pmNameLbl',pmAgeLbl:'pmAgeLbl',pmGenderLbl:'pmGenderLbl',pmCancel:'pmCancel',pmSave:'pmSave',amTitle:'amTitle',amPwdLbl:'amPwdLbl',amConfirmLbl:'amConfirmLbl',amConfirmSub:'amConfirmSub',amStatsLbl:'amStatsLbl',amStatsSub:'amStatsSub',amExportLbl:'amExportLbl',amExportSub:'amExportSub',amLogoutLbl:'amLogoutLbl',amLogoutSub:'amLogoutSub',qrTitle:'qrTitle',qrCloseLbl:'qrCloseLbl'};

function initGPS(){if(!navigator.geolocation){$('gpsTxt').textContent=t('gpsUnavailable');return}navigator.geolocation.getCurrentPosition(p=>{$('gpsTxt').textContent='📍 '+p.coords.latitude.toFixed(3)+','+p.coords.longitude.toFixed(3)},()=>{$('gpsTxt').textContent=t('gpsDenied')},{timeout:8000})}

  let devId=localStorage.getItem('plh_device');

  $('deviceId').textContent=devId;
  buildLangSelect();
  document.documentElement.lang=LANG;
  document.documentElement.dir=(LANGS.find(l=>l.code===LANG)||LANGS[0]).dir;
  applyLang();tick();setInterval(tick,1000);initGPS();setView('home');
  ['personalModal','measureModal','infoModal','adminModal','qrModal','reportModal'].forEach(id=>{$(id).addEventListener('click',e=>{if(e.target.id===id){if(id==='personalModal')closePersonalModal();else if(id==='measureModal')closeMeasureModal();else if(id==='infoModal')closeInfoModal();else if(id==='qrModal')closeQR();else if(id==='reportModal')closeReport();else closeAdmin()}})});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePersonalModal();closeMeasureModal();closeInfoModal();closeAdmin();closeQR();closeReport()}});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script>
</body>
</html>
